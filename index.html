<!DOCTYPE html>
<html>
    <body>
        <div id="cookie-banner" class="cookie-banner">
            <p>We use cookies to improve your experience on our website. By clicking "Accept", you agree to our use of cookies. <a id="cb-learn-more-button" onclick="var myself = document.getElementById('cb-learn-more-button'); var text = document.getElementById('cb-learn-more'); if (myself.textContent == 'Learn More') {myself.textContent = 'Hide'; text.hidden = false;} else {myself.textContent = 'Learn More'; text.hidden = true}">Learn More</a></p>
            <span id="cb-learn-more" hidden>We only save the date you input on the website.</span>
            <button onclick="acceptCookies();">Accept</button>
            <button onclick="denyCookies();">Decline</button>
        </div>
    </body>
</html>
